name: MLflow CI Retraining & Docker Build

on:
  push:
    branches: [ main ]

jobs:
  retrain-and-docker:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        pip install mlflow dagshub pandas scikit-learn PySastrawi joblib

    - name: Check Directory Structure
      run: ls -R  # Ini akan membantu kita melihat posisi file di log

    - name: MLflow Run (Retraining)
      env:
        MLFLOW_TRACKING_URI: https://dagshub.com/pyogaaa/SMSML_Yoga-pratama.mlflow
        MLFLOW_TRACKING_USERNAME: pyogaaa
        MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        GITHUB_ACTIONS: true
      run: |
        # Jika file MLProject ada di dalam folder 'MLProject', gunakan:
        # mlflow run MLProject/ --experiment-name "Retraining_CI"
        # Jika file MLProject ada di luar (root), gunakan:
        mlflow run . --experiment-name "Retraining_CI"

    - name: Wait for Registry
      run: sleep 60  # Memberi waktu DagsHub untuk memproses registrasi model (Penting!)

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build Docker Image via MLflow
      run: |
        mlflow models build-docker \
          -m "models:/Crime_Model/latest" \
          -n "${{ secrets.DOCKERHUB_USERNAME }}/mlflow-model-yoga:latest" \
          --install-mlflow

    - name: Push Docker Image
      run: |
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/mlflow-model-yoga:latest