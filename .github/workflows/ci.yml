name: MLflow CI Retraining & Docker Build

on:
  push:
    branches: [ main ]

jobs:
  retrain-and-docker:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        pip install mlflow dagshub pandas scikit-learn PySastrawi

    - name: MLflow Run (Retraining)
      env:
        MLFLOW_TRACKING_URI: https://dagshub.com/pyogaaa/SMSML_Yoga-pratama.mlflow
        MLFLOW_TRACKING_USERNAME: pyogaaa
        MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
      run: |
        mlflow run MLProject/ --experiment-name "Retraining_CI"

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build Docker Image via MLflow
      run: |
        # Menambahkan --install-mlflow agar library mlflow ikut terinstal di dalam image
        # Pastikan "Crime_Model" sudah diregistrasikan di langkah MLflow Run sebelumnya
        mlflow models build-docker \
          -m "models:/Crime_Model/latest" \
          -n "pyogaaa/mlflow-model-yoga:latest" \
          --install-mlflow

    - name: Push Docker Image
      run: |
        docker push pyogaaa/mlflow-model-yoga:latest